<!DOCTYPE html>
<html>

<head>

    <title>Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<header>

    <h1>Placement Preparation Dashboard</h1>

    <nav>

        <a href="/">Home</a>

        <a href="/login">Student Login</a>

    </nav>

</header>


<div class="container">

    <section class="hero">

        <h2>🔐 Admin Login</h2>

        <p>Login to access the administration panel.</p>

        <br>


        <form method="POST"
              action="/admin-login">

            <p>

                <label>Username:</label>

                <br>

                <input type="text"
                       name="username"
                       required>

            </p>

            <br>


            <p>

                <label>Password:</label>

                <br>

                <input type="password"
                       name="password"
                       required>

            </p>

            <br>


            <button type="submit"
                    class="btn">

                Admin Login

            </button>

        </form>

        <br>


        <a href="/" class="btn">
            ← Back to Home
        </a>

    </section>

</div>


<footer>

    <p>
        © 2026 Placement Preparation Dashboard
    </p>

</footer>

</body>

</html>
